<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Ticket System</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #f6f7fb; color: #1f2430; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    a { color: #2563eb; }
    .hero { background: linear-gradient(120deg, #6d28d9 0%, #2563eb 55%, #0ea5e9 100%); border-radius: 16px; padding: 26px 30px; color: #fff; margin-bottom: 20px; }
    .hero h1 { margin: 0; font-size: 1.9rem; font-weight: 700; }
    .hero p { margin: 6px 0 0; color: rgba(255, 255, 255, 0.85); font-size: 0.95rem; }
    .flash { border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; font-size: 0.92rem; }
    .flash-success { background: #d1fae5; color: #047857; }
    .flash-error { background: #fee2e2; color: #b91c1c; }
    .stats { display: flex; gap: 14px; margin: 0 0 18px; flex-wrap: wrap; }
    .stat { flex: 1; min-width: 140px; background: #fff; border: 1px solid rgba(128, 128, 140, 0.25); border-radius: 12px; padding: 12px 16px; }
    .stat .num { font-size: 1.5rem; font-weight: 700; }
    .stat .lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; }
    .filters { margin-bottom: 16px; font-size: 0.88rem; }
    .filters a { margin-right: 10px; text-decoration: none; padding: 4px 12px; border-radius: 999px; border: 1px solid rgba(128, 128, 140, 0.3); color: inherit; }
    .filters a.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .card { display: block; background: #fff; border: 1px solid rgba(128, 128, 140, 0.35); border-radius: 12px; padding: 14px 18px 12px; margin-bottom: 12px; text-decoration: none; color: inherit; transition: box-shadow 0.15s ease; }
    .card:hover { box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15); }
    .ticket-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .ticket-title { font-size: 1.02rem; font-weight: 600; }
    .ticket-pills { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em; }
    .pill-open { background: #fee2e2; color: #b91c1c; }
    .pill-in_progress { background: #fef3c7; color: #b45309; }
    .pill-resolved { background: #d1fae5; color: #047857; }
    .pill-muted { background: rgba(128, 128, 140, 0.15); color: #4b5563; font-weight: 500; }
    .ticket-footer { font-size: 0.78rem; color: #6b7280; margin-top: 8px; }
    .panel { background: #fff; border: 1px solid rgba(128, 128, 140, 0.35); border-radius: 12px; padding: 20px 22px; margin-bottom: 20px; }
    h2 { margin: 4px 0 16px; font-size: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 14px 0 4px; }
    input, textarea, select { width: 100%; padding: 9px 12px; border: 1px solid rgba(128, 128, 140, 0.4); border-radius: 8px; font: inherit; background: #fff; }
    textarea { min-height: 90px; resize: vertical; }
    button { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 14px; }
    button:hover { background: #1d4ed8; }
    .msg { border: 1px solid rgba(128, 128, 140, 0.3); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; background: #fff; }
    .msg .meta { font-size: 0.75rem; color: #6b7280; margin-bottom: 4px; }
    .empty { text-align: center; padding: 48px 20px; color: #6b7280; }
    .detail-grid { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
    .detail-grid .stat { flex: 0 1 200px; }
    .status-form { display: flex; gap: 10px; align-items: center; }
    .status-form select { max-width: 240px; }
    .status-form button { margin-top: 0; }
    .backlink { font-size: 0.85rem; margin-bottom: 10px; display: inline-block; }
  </style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>🎫 Support Ticket System</h1>
    <p>Track, discuss, and resolve support tickets — powered by Databricks Apps &amp; Lakebase</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
