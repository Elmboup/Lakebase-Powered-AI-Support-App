{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h2>New Support Ticket</h2>
    <div class="sub">Describe your issue and we'll get on it</div>
  </div>
  <a class="btn ghost" href="{{ url_for('index') }}">← Back to tickets</a>
</div>
<div class="panel" style="max-width: 680px;">
  <form method="post" action="{{ url_for('new_ticket') }}">
    <label for="title">Ticket title <span class="req">*</span></label>
    <input type="text" id="title" name="title" maxlength="255" required placeholder="Short summary, e.g. Cannot log in to dashboard" value="{{ form.get('title', '') }}">
    <label for="created_by">Your email <span class="req">*</span></label>
    <input type="email" id="created_by" name="created_by" maxlength="100" required placeholder="you@company.com" value="{{ form.get('created_by', '') }}">
    <div class="hint">We'll use this to follow up on your ticket.</div>
    <label for="initial_message">Describe the issue</label>
    <textarea id="initial_message" name="initial_message" maxlength="1000" placeholder="What happened? What did you expect? Any error messages?">{{ form.get('initial_message', '') }}</textarea>
    <div class="hint">Optional, but the more detail you share, the faster we can help.</div>
    <div style="margin-top: 22px;">
      <button class="btn" type="submit">Create ticket →</button>
    </div>
  </form>
</div>
{% endblock %}
